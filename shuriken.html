<title>おばけ しゅりけん</title>

<style>
/* おばけ しゅりけん: point where the star should fly, let go, and it cuts every ghost on its way.
   The play field keeps one shape (3:4) on every screen, so a stage is the same on an iPad held either way. */
:root{
  --night:#170f2e; --star:#ffd23f; --pumpkin:#ff8a2a; --cream:#fff8ee; --mist:#c4b8ec;
  --f-pop:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--cream);font-family:var(--f-round);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:8px;padding:8px 12px;pointer-events:none;z-index:2}
.top>*{pointer-events:auto}
.icon-btn{display:grid;place-items:center;min-width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.1);color:var(--cream);font:400 20px var(--f-pop);text-decoration:none;cursor:pointer}
.icon-btn[aria-pressed="false"]{opacity:.5}
.lv{font:400 clamp(16px,4vw,22px) var(--f-pop);color:var(--star);text-shadow:0 3px 0 #6a2fb0}
.throws{display:flex;gap:3px;font-size:clamp(18px,4.5vw,26px);color:var(--star);margin-left:auto;text-shadow:0 2px 0 #6a2fb0}
.throws .used{opacity:.25}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none;z-index:3}
.overlay:empty{display:none}
.panel{pointer-events:auto;background:rgba(23,15,46,.93);border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,138,42,.35);padding:20px 22px 24px;width:min(460px,100%);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel h2{margin:0;font:400 clamp(28px,7vw,40px)/1.15 var(--f-pop);text-shadow:0 4px 0 #6a2fb0}
.panel h2 small{display:block;font-size:.45em;color:var(--pumpkin);text-shadow:none;margin-bottom:4px}
.panel p{margin:0;font-weight:800;line-height:1.6;color:var(--mist)}
.stars{font-size:44px;letter-spacing:4px;color:var(--star)}
.stars .off{color:#4a3a70}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:400 24px var(--f-pop);letter-spacing:.06em;color:#3a1600;background:linear-gradient(#ffc070,var(--pumpkin));border:0;border-radius:999px;padding:13px 36px;box-shadow:0 6px 0 #a8480b,0 12px 24px rgba(0,0,0,.4);cursor:pointer}
.btn.sub{font-size:18px;padding:11px 22px;color:var(--cream);background:linear-gradient(#7a52d8,#4d2fa0);box-shadow:0 5px 0 #2a1866}
.btn:active{transform:translateY(4px)}
.btn:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--star);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
<div id="stage">
  <canvas id="game" role="img" aria-label="おばけ しゅりけん。とばしたい ほうを ゆびで さして、はなすと しゅりけんが とぶ。やじるしキーで ねらって、スペースキーで なげる こともできる"></canvas>
  <div class="top">
    <a class="icon-btn" href="index.html" aria-label="ゲームを えらぶ">☰</a>
    <span class="lv" id="lv"></span>
    <button class="icon-btn" id="snd" aria-pressed="true" aria-label="おと">♪</button>
    <span class="throws" id="throws" role="img"></span>
  </div>
  <div class="overlay" id="overlay" aria-live="polite"></div>
</div>

// ---------- pictures ----------
const IMG={};
const loadImg=src=>new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=src; });
function sheet(set,n){ const k=set+n; if(!IMG[k]) IMG[k]=loadImg(`a/${set}/g${n}.webp`).then(i=>(IMG[k]=i),()=>{ delete IMG[k]; return null; }); return IMG[k]; }
const SETNAMES=Object.keys(SHEETS);
function randomGhost(){ const set=pick(SETNAMES), id=Math.random()*500|0; return {set,id}; }
function drawGhostImg(g,size){
  const img=IMG[g.set+(g.id/20|0)]; if(!(img instanceof Image)) return false;
  const m=SHEETS[g.set][g.id/20|0], f=g.id%20, k=size/Math.max(m.fw,m.fh);
  cx.drawImage(img,f*m.fw,0,m.fw,m.fh,-m.fw*k/2,-m.fh*k/2,m.fw*k,m.fh*k); return true;
}
const F={run:[0,1,2,3],jump:4,shoot:5,idle:6,wave:7,cheer:8,dance:9,dizzy:10,joy:11};

function recolor(img,hex){
  const can=document.createElement('canvas'); can.width=img.width; can.height=img.height;

  const d=g.getImageData(0,0,can.width,can.height), p=d.data;
  for(let i=0;i<p.length;i+=4){

  throw(){ if(!ok()) return; const t=ac.currentTime; noise(t,.25,.12,2400,'bandpass'); tone(900,t,.18,'triangle',.05,1500); },
  slice(k){ if(!ok()) return; const t=ac.currentTime; noise(t,.18,.2,5200,'highpass'); tone(1400+k*180,t,.22,'sawtooth',.04,500); tone(1800+k*220,t+.03,.25,'triangle',.06,2600); },

// ---------- the stages ----------
// positions are fractions of the field (x across, y down); the crew stands at the bottom middle
function rng(seed){ let s=seed>>>0||1; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }
const LAST=30;
function stageDef(n){
  const R=rng(n*7919+13), r=(a,b)=>a+R()*(b-a);
  const st={g:[],b:[],f:[],extra:2};
  if(n===1){ st.g=[{x:.5,y:.32}]; st.hint=true; return st; }
  if(n===2){ st.g=[{x:.3,y:.3},{x:.7,y:.42}]; return st; }
  if(n===3){ st.g=[{x:.22,y:.26},{x:.5,y:.4},{x:.78,y:.26}]; return st; }
  const endless=n>LAST, tier=endless?4:n<=9?1:n<=19?2:n<=29?3:4;
  if(n%10===0){
    // a big ghost that needs several cuts, with a few small ones around it
    const hp=Math.min(5,2+(n/10|0));
    st.g.push({x:.5,y:.3,s:2,hp,mv:n>=20?{ax:.18,ay:0,sp:.18,ph:0}:null});
    for(let i=0;i<Math.min(4,n/10|0);i++) st.g.push({x:i%2?.82:.18,y:.18+.24*(i/2|0)});
    if(n>=30) st.b.push({x:.5,y:.56,w:.24,h:.035});
    st.boss=true; st.extra=hp+2; return st;
  }
  const lineStage=(tier===1&&n%3===0)||(tier>1&&R()<.3);
  if(lineStage){
    // ghosts in a row on one line from the crew: one good throw cuts them all
    const a=r(-Math.PI*.72,-Math.PI*.28), k=tier===1?3:4;
    for(let i=0;i<k;i++){ const d=.24+i*.15; st.g.push({x:.5+Math.cos(a)*d*.75,y:.9+Math.sin(a)*d}); }
    st.g=st.g.filter(g=>g.x>.1&&g.x<.9&&g.y>.1);
    st.extra=1; st.line=true;
  }
  const want=Math.min(7,2+Math.ceil(n/4)+(tier>=3?1:0));
  let tries=0;
  while(st.g.length<want&&tries++<400){
    const g={x:r(.14,.86),y:r(.12,tier>=2?.6:.55)};
    if(st.g.some(o=>Math.hypot(o.x-g.x,(o.y-g.y)*1.33)<.2)) continue;
    if(n>=7&&R()<(tier===1?.35:.45)) g.mv={ax:r(.06,.14)*(R()<.5?-1:1),ay:R()<.3?r(.03,.06):0,sp:r(.12,.3),ph:r(0,6.3)};
    st.g.push(g);
  }
  if(tier>=2){
    // stones: under some ghosts (go round them, or bounce off a wall), or across the middle
    const nb=Math.min(4,1+(n-10)/4|0);
    // a stone may not touch another stone or sit on a ghost (moving ghosts: anywhere along their way)
    const clear=b=>!st.b.some(o=>Math.abs(o.x-b.x)<(o.w+b.w)/2+.04&&Math.abs(o.y-b.y)<.11)
      &&!st.g.some(o=>Math.abs(o.x-b.x)<b.w/2+.1+(o.mv?Math.abs(o.mv.ax):0)&&Math.abs(o.y-b.y)<.075+(o.mv?o.mv.ay:0));
    for(let i=0;i<nb;i++){
      const g=st.g[i%st.g.length];
      for(let k=0;k<40;k++){
        const b=(g&&!g.mv&&k<10&&g.y<.5)?{x:clamp(g.x+r(-.05,.05),.2,.8),y:g.y+.1,w:r(.18,.26),h:.035}:{x:r(.22,.78),y:r(.38,.66),w:r(.14,.24),h:.035};
        if(clear(b)){ st.b.push(b); break; }
      }
    }
    st.extra=1+Math.ceil(st.b.length/2);
  }
  if(tier>=3){
    // friends: the crew's friends float among the ghosts; the star bounces off them
    const nf=Math.min(3,1+(n-20)/4|0);
    for(let i=0;i<nf;i++){
      for(let t=0;t<60;t++){
        const f={x:r(.15,.85),y:r(.2,.62),c:1+(R()*6|0)};
        if(st.g.some(o=>Math.hypot(o.x-f.x,(o.y-f.y)*1.33)<.16)||st.f.some(o=>Math.hypot(o.x-f.x,o.y-f.y)<.2)) continue;
        st.f.push(f); break;
      }
    }
    st.extra+=1;
  }
  return st;
}

// ---------- state ----------
let W=800,H=600,DPR=1, FLD={x:0,y:0,w:600,h:800};

const P=()=>({x:FLD.x+FLD.w*.5,y:FLD.y+FLD.h*.95});

let t0=0, seenFriend=false;

// ---------- aiming and throwing ----------
function aimFrom(px,py){
  const p=P(); let dx=px-p.x, dy=py-p.y;
  if(Math.hypot(dx,dy)<10) return null;
  let a=Math.atan2(dy,dx);

  const lo=-Math.PI+.12, hi=-.12; if(a>hi&&a<=Math.PI/2) a=hi; else if(a>Math.PI/2||a<lo) a=lo;

}
let keyAim=-Math.PI/2;
function throwStar(a){
  if(state!=='aim'||throwsLeft<=0||star) return;
  ensureAudio(); const p=P(), sp=FLD.h*1.5;
  star={x:p.x,y:p.y-FLD.h*.06,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:0,bounces:0,life:0,trail:[],id:++throwId};
  throwsLeft--; comboThisThrow=0; aim=null; hud(); sfx.throw(); crewPose={f:F.shoot,t:0,flip:Math.cos(a)<0};
}
cv.addEventListener('pointerdown',e=>{ if(state!=='aim') return; ensureAudio(); cv.setPointerCapture(e.pointerId); aim=aimFrom(e.clientX-cv.getBoundingClientRect().left,e.clientY-cv.getBoundingClientRect().top); });

addEventListener('keydown',e=>{
  if(state!=='aim'||overlay.innerHTML) return;
  if(e.key==='ArrowLeft'){ keyAim=Math.max(-Math.PI+.12,keyAim-.05); aim=keyAim; e.preventDefault(); }
  if(e.key==='ArrowRight'){ keyAim=Math.min(-.12,keyAim+.05); aim=keyAim; e.preventDefault(); }
  if(e.key===' '||e.key==='Enter'){ throwStar(aim??keyAim); e.preventDefault(); }
});

// the path the star will take (walls and stones only), for the dotted aim line
function predict(a){
  const p=P(), r=SR(); let x=p.x,y=p.y-FLD.h*.06, vx=Math.cos(a), vy=Math.sin(a), pts=[], b=0, len=0;
  const step=4, maxLen=FLD.h*(level<=3?2.2:1.35);
  while(len<maxLen&&b<=1){
    const px=x,py=y; x+=vx*step; y+=vy*step; len+=step;
    if(x<FLD.x+r){ x=FLD.x+r; vx=Math.abs(vx); b++; } if(x>FLD.x+FLD.w-r){ x=FLD.x+FLD.w-r; vx=-Math.abs(vx); b++; }
    if(y<FLD.y+r){ y=FLD.y+r; vy=Math.abs(vy); b++; }
    if(y>FLD.y+FLD.h+r) break;
    for(const bl of blocks){ const hit=rectHit(bl,x,y,r); if(hit){ if(hit==='x') vx=-vx; else vy=-vy; x=px; y=py; b++; } }
    if(len%22<step) pts.push([x,y]);

function blockRect(bl){ const c=toPx(bl), w=bl.w*FLD.w, h=bl.h*FLD.h; return {x0:c.x-w/2,y0:c.y-h/2,x1:c.x+w/2,y1:c.y+h/2}; }

// ---------- cutting a ghost along the star's path ----------
function cut(g,sx,sy,vx,vy){

  for(let i=0;i<22;i++){ const k=rand(0,Math.PI*2), v=rand(80,320); fx.push({x:p.x,y:p.y,vx:Math.cos(k)*v,vy:Math.sin(k)*v,life:rand(.4,.8),max:.8,col:pick(['#ffd23f','#ffffff','#b36bff','#58e8ff','#ff7fc8']),s:rand(5,11)}); }

// ---------- the loop ----------
function update(dt){
  t+=dt;
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt; if(p.life<=0) fx.splice(i,1); }
  for(let i=pieces.length-1;i>=0;i--){ const p=pieces[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=FLD.h*1.4*dt; p.rot+=p.vr*dt; p.life-=dt; if(p.life<=0) pieces.splice(i,1); }
  for(let i=texts.length-1;i>=0;i--){ texts[i].t+=dt; if(texts[i].t>1.6) texts.splice(i,1); }
  ghosts.forEach(g=>{ if(g.hurt>0) g.hurt-=dt; }); friends.forEach(f=>{ if(f.shake>0) f.shake-=dt; });
  crewPose.t+=dt; if(crewPose.f===F.shoot&&crewPose.t>.45) crewPose={f:F.idle,t:0};
  if(star){
    const r=SR(), n=Math.ceil(Math.hypot(star.vx,star.vy)*dt/(r*.5));
    for(let k=0;k<n&&star;k++){
      const h=dt/n, px=star.x, py=star.y; star.x+=star.vx*h; star.y+=star.vy*h; star.life+=h;
      if(star.x<FLD.x+r){ star.x=FLD.x+r; star.vx=Math.abs(star.vx); star.bounces++; sfx.clink(); }
      if(star.x>FLD.x+FLD.w-r){ star.x=FLD.x+FLD.w-r; star.vx=-Math.abs(star.vx); star.bounces++; sfx.clink(); }
      if(star.y<FLD.y+r){ star.y=FLD.y+r; star.vy=Math.abs(star.vy); star.bounces++; sfx.clink(); }
      for(const bl of blocks){ const hit=rectHit(bl,star.x,star.y,r); if(hit){ if(hit==='x') star.vx=-star.vx; else star.vy=-star.vy; star.x=px; star.y=py; star.bounces++; sfx.clink(); } }
      for(const f of friends){ const fp=toPx(f), fr=FLD.w*.06; const dx=star.x-fp.x, dy=star.y-(fp.y-fr*.9); if(Math.hypot(dx,dy)<fr+r&&f.last!==star.id+':'+star.bounces){ f.last=star.id+':'+star.bounces; const l=Math.hypot(dx,dy)||1, nx=dx/l, ny=dy/l, dot=star.vx*nx+star.vy*ny; if(dot<0){ star.vx-=2*dot*nx; star.vy-=2*dot*ny; } star.bounces++; f.shake=.6; sfx.bonk(); texts.push({s:'あぶない！',x:f.x,y:f.y-.1,t:0}); } }
      for(const g of ghosts){ if(!g.alive||g.hitBy===star.id) continue; const p=ghostPos(g); if(Math.hypot(star.x-p.x,star.y-p.y)<GS()*g.s*.42+r*.5) hitGhost(g); }
      star.trail.push([star.x,star.y]); if(star.trail.length>14) star.trail.shift();
      if(star.y>FLD.y+FLD.h+r*2||star.bounces>5||star.life>4){ star=null; afterThrow(); }
    }

}

function titlePanel(){
  state='title';
  panel(`<h2><small>ゆびで ねらって、はなすと とぶ！</small>おばけ しゅりけん</h2>
    <p>ほしの しゅりけんで<br>おばけを スパッと きろう！</p>
    <div class="btns"><button class="btn" id="go">${best>1?(best>LAST?'むげん '+(best-LAST):'ステージ '+best)+' から':'はじめる'}</button>${best>1?'<button class="btn sub" id="first">さいしょから</button>':''}</div>`);
  $('go').onclick=()=>{ ensureAudio(); fails=0; startLevel(best); };
  if($('first')) $('first').onclick=()=>{ ensureAudio(); fails=0; startLevel(1); };
}

// ---------- drawing ----------
let hallImg=null;
function draw(){
  cx.clearRect(0,0,W,H);
  if(hallImg){ const s=Math.max(W/hallImg.width,H/hallImg.height); cx.drawImage(hallImg,(W-hallImg.width*s)/2,(H-hallImg.height*s)/2,hallImg.width*s,hallImg.height*s); }
  // the field: darker outside, a soft frame
  cx.save(); cx.fillStyle='rgba(10,6,24,.6)'; cx.beginPath(); cx.rect(0,0,W,H); roundRect(FLD.x,FLD.y,FLD.w,FLD.h,22,true); cx.fill('evenodd'); cx.restore();
  cx.save(); cx.fillStyle='rgba(23,15,46,.18)'; roundRect(FLD.x,FLD.y,FLD.w,FLD.h,22); cx.fill(); cx.lineWidth=3; cx.strokeStyle='rgba(255,210,63,.35)'; cx.stroke(); cx.restore();
  if(state==='title'){ drawTitleGhosts(); drawCrew(heroCol,[F.dance,F.cheer][(t*2|0)%2],P().x,P().y,FLD.h*.13); drawFx(); return; }
  // stones
  for(const bl of blocks){ const R=blockRect(bl); cx.save(); const g=cx.createLinearGradient(0,R.y0,0,R.y1); g.addColorStop(0,'#9a8fb8'); g.addColorStop(1,'#5d5380'); cx.fillStyle=g; roundRect(R.x0,R.y0,R.x1-R.x0,R.y1-R.y0,6); cx.fill(); cx.lineWidth=3; cx.strokeStyle='#2a1440'; cx.stroke(); cx.restore(); }
  // ghosts
  for(const g of ghosts){ if(!g.alive) continue; const p=ghostPos(g), s=GS()*g.s, bob=Math.sin(t*2.2+g.x*9)*s*.04, sh=g.hurt>0?Math.sin(t*60)*6:0;
    cx.save(); cx.translate(p.x+sh,p.y+bob); cx.rotate(Math.sin(t*1.6+g.y*7)*.06); const pop=Math.max(.01,ease((t-t0)/.45)); cx.scale(pop,pop);
    if(g.max>1){ cx.save(); cx.fillStyle='rgba(255,80,80,.25)'; cx.beginPath(); cx.arc(0,0,s*.55,0,7); cx.fill(); cx.restore(); }
    drawGhostImg(g,s); if(g.hurt>0){ cx.globalCompositeOperation='source-atop'; cx.fillStyle=`rgba(255,255,255,${g.hurt})`; cx.fillRect(-s,-s,s*2,s*2); }
    cx.restore();
    if(g.max>1){ for(let i=0;i<g.max;i++){ cx.fillStyle=i<g.hp?'#ff4b3e':'#4a3a70'; cx.beginPath(); cx.arc(p.x+(i-(g.max-1)/2)*16,p.y-s*.6,6,0,7); cx.fill(); } }
  }
  // friends
  for(const f of friends){ const p=toPx(f); drawCrew(f.c,f.shake>0?F.dizzy:[F.wave,F.cheer][(t*1.5+f.x*4|0)%2],p.x+(f.shake>0?Math.sin(t*50)*4:0),p.y+FLD.w*.05,FLD.w*.13); }
  // cut pieces
  for(const p of pieces){ cx.save(); cx.globalAlpha=clamp(p.life/.5,0,1); cx.translate(p.x,p.y); cx.rotate(p.rot);
    const L=p.size*2, ux=Math.cos(p.a), uy=Math.sin(p.a), nx=-uy*p.side, ny=ux*p.side, ox=-Math.sin(p.a)*p.d, oy=Math.cos(p.a)*p.d;
    cx.beginPath(); cx.moveTo(ox-ux*L,oy-uy*L); cx.lineTo(ox+ux*L,oy+uy*L); cx.lineTo(ox+ux*L+nx*L,oy+uy*L+ny*L); cx.lineTo(ox-ux*L+nx*L,oy-uy*L+ny*L); cx.closePath(); cx.clip();
    drawGhostImg(p.g,p.size); cx.restore(); }
  // aim
  if(state==='aim'&&aim!==null){ const pts=predict(aim); cx.save(); pts.forEach(([x,y],i)=>{ cx.globalAlpha=1-i/pts.length*.7; cx.fillStyle=i%2?'#ffd23f':'#fff8ee'; cx.beginPath(); cx.arc(x,y,Math.max(3,FLD.w*.009),0,7); cx.fill(); }); cx.restore(); }
  else if(state==='aim'&&def&&def.hint&&!star){ const g=ghosts[0], p=ghostPos(g), k=(t*.8)%1, P0=P(); const x=P0.x+(p.x-P0.x)*ease(k)*.8, y=P0.y+(p.y-P0.y)*ease(k)*.8;
    cx.save(); cx.globalAlpha=1-k; cx.font=`${FLD.w*.1}px sans-serif`; cx.textAlign='center'; cx.fillText('👆',x,y+FLD.w*.06); cx.restore();
    drawLabel('おばけを ゆびで さして、はなしてね',.5,.74,FLD.w*.045,'#fff8ee'); }
  // crew
  const P0=P(); drawCrew(heroCol,crewPose.f,P0.x,P0.y,FLD.h*.13,crewPose.flip,crewPose.f===F.dizzy?Math.sin(t*12)*.08:0);
  // star
  if(star){ cx.save(); star.trail.forEach(([x,y],i)=>{ cx.globalAlpha=i/star.trail.length*.5; cx.fillStyle='#ffd23f'; cx.beginPath(); cx.arc(x,y,SR()*.5*i/star.trail.length,0,7); cx.fill(); }); cx.restore(); drawStar(star.x,star.y,SR(),star.rot); }
  else if(state==='aim'&&throwsLeft>0){ drawStar(P0.x+FLD.h*.05,P0.y-FLD.h*.09,SR()*.8,t*2); }
  drawFx();
  for(const s of texts){ if(s.t<0) continue; const a=s.t>1.2?1-(s.t-1.2)/.4:1; cx.save(); cx.globalAlpha=clamp(a,0,1); drawLabel(s.s,s.x,s.y-s.t*.03,FLD.w*(s.big?.085:.065)*(1+Math.max(0,.15-s.t)*3),s.big?'#ffd23f':'#fff8ee'); cx.restore(); }
}
function drawFx(){ for(const p of fx){ cx.save(); cx.globalAlpha=clamp(p.life/p.max*1.5,0,1); cx.fillStyle=p.col; if(p.conf) cx.fillRect(p.x,p.y,p.s,p.s/2); else { cx.beginPath(); cx.arc(p.x,p.y,p.s/2,0,7); cx.fill(); } cx.restore(); } }
function drawLabel(s,fx_,fy,size,col){ const x=FLD.x+fx_*FLD.w, y=FLD.y+fy*FLD.h; cx.save(); cx.font=`${size}px "Mochiy Pop One",sans-serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.lineJoin='round'; cx.lineWidth=size*.2; cx.strokeStyle='#2a1440'; cx.strokeText(s,x,y); cx.fillStyle=col; cx.fillText(s,x,y); cx.restore(); }
function drawStar(x,y,r,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot);
  cx.beginPath(); for(let i=0;i<8;i++){ const rr=i%2?r*.38:r, a=i/8*Math.PI*2; cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } cx.closePath();
  const g=cx.createRadialGradient(0,0,r*.1,0,0,r); g.addColorStop(0,'#fffbe0'); g.addColorStop(1,'#ffc23a'); cx.fillStyle=g; cx.fill(); cx.lineWidth=Math.max(2,r*.14); cx.strokeStyle='#2a1440'; cx.stroke();
  cx.fillStyle='#2a1440'; cx.beginPath(); cx.arc(0,0,r*.16,0,7); cx.fill(); cx.restore();
}
function roundRect(x,y,w,h,r,keep){ if(!keep) cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
const titleG=[];
function drawTitleGhosts(){ titleG.forEach((g,i)=>{ const a=t*.4+i/titleG.length*Math.PI*2, x=FLD.x+FLD.w*(.5+Math.cos(a)*.36), y=FLD.y+FLD.h*(.28+Math.sin(a)*.12); cx.save(); cx.translate(x,y); drawGhostImg(g,GS()*.9); cx.restore(); }); }

let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }

$('snd').setAttribute('aria-pressed',soundOn);
$('snd').addEventListener('click',e=>{ soundOn=!soundOn; e.currentTarget.setAttribute('aria-pressed',soundOn); save(); ensureAudio(); });
new ResizeObserver(resize).observe($('stage'));
(async()=>{
  resize();
  try{ const [crew,hall]=await Promise.all([loadImg(CREWA.src),loadImg(HALL)]); CREWCOL.forEach((c,i)=>crewCan[i]=recolor(crew,c)); hallImg=hall; }catch(e){}
  for(let i=0;i<6;i++){ const g=randomGhost(); titleG.push(g); sheet(g.set,g.id/20|0); }
  try{ await document.fonts.load('40px "Mochiy Pop One"'); }catch(e){}
  hud(); titlePanel(); requestAnimationFrame(loop);
})();
})();
</script>
