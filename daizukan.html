 208, "src": "a/kata/g8.webp"}, {"n": 20, "fw": 246, "fh": 189, "src": "a/kata/g9.webp"}, {"n": 20, "fw": 246, "fh": 198, "src": "a/kata/g10.webp"}, {"n": 20, "fw": 246, "fh": 175, "src": "a/kata/g11.webp"}, {"n": 20, "fw": 246, "fh": 157, "src": "a/kata/g12.webp"}, {"n": 20, "fw": 246, "fh": 191, "src": "a/kata/g13.webp"}, {"n": 20, "fw": 246, "fh": 189, "src": "a/kata/g14.webp"}, {"n": 20, "fw": 246, "fh": 213, "src": "a/kata/g15.webp"}, {"n": 20, "fw": 246, "fh": 236, "src": "a/kata/g16.webp"}, {"n": 20, "fw": 246, "fh": 205, "src": "a/kata/g17.webp"}, {"n": 20, "fw": 246, "fh": 218, "src": "a/kata/g18.webp"}, {"n": 20, "fw": 244, "fh": 246, "src": "a/kata/g19.webp"}, {"n": 20, "fw": 246, "fh": 217, "src": "a/kata/g20.webp"}, {"n": 20, "fw": 246, "fh": 212, "src": "a/kata/g21.webp"}, {"n": 20, "fw": 246, "fh": 215, "src": "a/kata/g22.webp"}, {"n": 20, "fw": 246, "fh": 201, "src": "a/kata/g23.webp"}, {"n": 20, "fw": 246, "fh": 212, "src": "a/kata/g24.webp"}]}];      // [{id,key,name,ghosts:[{n,f,r}],atlases:[{fw,fh,src}]}]
// voice: a/<set>/v/n_<i>.m4a and f_<i>.m4a, fetched when a card is opened
const $=id=>document.getElementById(id);
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const caught={};
SETS.forEach(s=>{ try{ caught[s.id]=JSON.parse(localStorage.getItem(s.key+'caught')||'{}'); }catch(e){ caught[s.id]={}; } });
const has=(s,i)=>caught[s][i]>0;

// ---------- pictures ----------
const IMG={};
function loadImg(src){ return new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=src; }); }
const gload={};
function loadSheet(set,n){ const k=set+n; if(!gload[k]){ const S=SETS.find(x=>x.id===set); gload[k]=loadImg(S.atlases[n].src).then(i=>{ IMG[k]=i; return i; },()=>{ delete gload[k]; return null; }); } return gload[k]; }
function spriteFit(el,s,f){
  const r=s.fw/s.fh;
  if(r>=1){ el.style.backgroundSize='2000% auto'; el.style.backgroundPosition=`${f/19*100}% 50%`; }
  else{ el.style.backgroundSize='auto 100%'; el.style.backgroundPosition=`${(f*r-(1-r)/2)/(20*r-1)*100}% 0`; }
}
function ghostSprite(set,id,dark){
  const S=SETS.find(x=>x.id===set), a=S.atlases[id/20|0], f=id%20, w=document.createElement('span'), i=document.createElement('i');
  w.className='gs'+(dark?' dark':''); i.style.backgroundImage=`url("${a.src}")`; spriteFit(i,a,f);
  w.appendChild(i); if(dark){ const q=document.createElement('b'); q.textContent='？'; w.appendChild(q); } return w;
}
function ghostCanvas(set,id,dark,px=112){
  const S=SETS.find(x=>x.id===set), n=id/20|0, a=S.atlases[n], f=id%20, c=document.createElement('canvas'); c.width=c.height=px;
  const g=c.getContext('2d'), k=px*.93/Math.max(a.fw,a.fh);
  const paint=()=>g.drawImage(IMG[set+n],f*a.fw,0,a.fw,a.fh,px/2-a.fw*k/2,px/2-a.fh*k/2,a.fw*k,a.fh*k);
  if(IMG[set+n]) paint(); else loadSheet(set,n).then(i=>{ if(i) paint(); });
  if(dark){ g.globalCompositeOperation='source-in'; g.fillStyle='#3a2a70'; g.fillRect(0,0,px,px); g.globalCompositeOperation='source-over'; g.fillStyle='#c4b8ec'; g.font=`${px*.36}px "Mochiy Pop One",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('？',px/2,px*.54); }
  return c;
}

// ---------- voice (the same recordings as the games) ----------
let ac=null, vnode=null, vtok=0;
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state!=='running') ac.resume().catch(()=>{}); }
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,ensureAudio,{passive:true,capture:true}));
const vbuf={};
function vget(k){ if(vbuf[k]) return vbuf[k]; if(!ac) return Promise.resolve(null); const [set,kind,i]=k.split(':');
  vbuf[k]=fetch(`a/${set}/v/${kind}_${i}.m4a`).then(r=>r.ok?r.arrayBuffer():null).catch(()=>null).then(buf=>buf?new Promise(res=>ac.decodeAudioData(buf,res,()=>res(null))):null).then(x=>{ if(!x) delete vbuf[k]; return x; });
  return vbuf[k]; }
function vstop(){ vtok++; if(vnode){ try{vnode.stop();}catch(e){} vnode=null; } }
async function say(keys){
  ensureAudio(); vstop(); const tok=vtok;
  for(const k of keys){
    const buf=await vget(k); if(tok!==vtok) return; if(!buf) continue;
    await new Promise(res=>{ const s=ac.createBufferSource(); s.buffer=buf; s.connect(ac.destination); s.onended=res; vnode=s; s.start(); });
    if(tok!==vtok) return;
  }
}

// ---------- the book ----------
let tab='all';
function render(){
  const total=SETS.reduce((n,s)=>n+s.ghosts.filter((g,i)=>has(s.id,i)).length,0);
  $('got').textContent=total; const max=SETS.reduce((n,s)=>n+s.ghosts.length,0); $('max').textContent=max; $('barI').style.width=Math.max(total/max*100,1)+'%'; $('bar').setAttribute('aria-label',`${max}ぴき ちゅう ${total}ひき あつめた`);
  const tabs=document.querySelector('.tabs'); tabs.innerHTML='';
  [['all','ぜんぶ'],...SETS.map(s=>[s.id,s.name])].forEach(([id,label])=>{
    const b=document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-selected',tab===id); b.textContent=label;
    b.addEventListener('click',()=>{ tab=id; render(); }); tabs.appendChild(b);
  });
  const books=$('books'); books.innerHTML='';
  SETS.filter(s=>tab==='all'||tab===s.id).forEach(s=>{
    const n=s.ghosts.filter((g,i)=>has(s.id,i)).length, sec=document.createElement('section');
    sec.innerHTML=`<h2>${s.name}の おばけ <span>${n}／${s.ghosts.length}</span></h2><div class="grid"></div>`;
    const grid=sec.querySelector('.grid');
    s.ghosts.forEach((g,i)=>{
      const got=has(s.id,i), b=document.createElement('button');
      b.className=(got?'on':'')+(g.r===3?' r3':''); b.setAttribute('aria-label',got?g.n:'まだ みつけていない おばけ');
      b.appendChild(ghostSprite(s.id,i,!got));
      b.addEventListener('click',()=>{ if(got){ openCard(s.id,i,b); say([`${s.id}:n:${i}`]); } });
      grid.appendChild(b);
    });
    books.appendChild(sec);
  });
}
// every caught ghost, in book order, so the arrows can step through all of them
const allGot=()=>SETS.flatMap(s=>s.ghosts.map((g,i)=>[s.id,i]).filter(([,i])=>has(s.id,i)));
let cardEl=null, cardReturn=null;
function openCard(set,id,from){
  closeCard(true); cardReturn=from||cardReturn;
  const S=SETS.find(x=>x.id===set), g=S.ghosts[id], list=allGot(), pos=list.findIndex(([s,i])=>s===set&&i===id);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
    <div class="no">${S.name} No.${String(id+1).padStart(3,'0')}</div><div class="rare">${stars(g.r)}${g.r===3?' レア！':''}</div>
    <h3 id="cardName"></h3><p id="cardFeat"></p><p class="count"></p>
    <div class="row"><button class="btn sub" id="cardRead">よんで！</button><button class="btn" id="cardClose">とじる</button></div>
    ${list.length>1?'<button class="nav prev" id="cardPrev" aria-label="まえの おばけ">‹</button><button class="nav next" id="cardNext" aria-label="つぎの おばけ">›</button>':''}
  </div>`;
  const big=ghostCanvas(set,id,false,520); big.setAttribute('role','img'); big.setAttribute('aria-label',g.n);
  m.querySelector('.card').insertBefore(big,m.querySelector('h3'));
  m.querySelector('#cardName').textContent=g.n; m.querySelector('#cardFeat').textContent=g.f;
  m.querySelector('.count').textContent=`つかまえた かず　${caught[set][id]}かい`;
  m.addEventListener('click',e=>{ if(e.target===m) closeCard(); });
  m.querySelector('#cardClose').addEventListener('click',()=>closeCard());
  m.querySelector('#cardRead').addEventListener('click',()=>say([`${set}:n:${id}`,`${set}:f:${id}`]));
  const step=d=>{ const [s2,i2]=list[(pos+d+list.length)%list.length]; openCard(s2,i2); say([`${s2}:n:${i2}`]); };
  m.querySelector('#cardPrev')?.addEventListener('click',()=>step(-1));
  m.querySelector('#cardNext')?.addEventListener('click',()=>step(1));
  document.body.appendChild(m); cardEl=m; $('main').inert=true;
  m.querySelector('#cardClose').focus({preventScroll:true});
}
function closeCard(keepReturn){
  if(!cardEl) return;
  cardEl.remove(); cardEl=null; $('main').inert=false; vstop();
  if(!keepReturn){ if(cardReturn&&document.contains(cardReturn)) cardReturn.focus({preventScroll:true}); cardReturn=null; }
}
addEventListener('keydown',e=>{ if(!cardEl) return; if(e.key==='Escape') closeCard(); if(e.key==='ArrowRight') cardEl.querySelector('#cardNext')?.click(); if(e.key==='ArrowLeft') cardEl.querySelector('#cardPrev')?.click(); });

(async()=>{
  // the sheets are shown as CSS sprites; a card's big picture loads its sheet when opened
  try{ await document.fonts.load('40px "Mochiy Pop One"'); }catch(e){}
  render();
})();
})();
