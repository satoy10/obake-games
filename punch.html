<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブヨンパンチゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* ブヨンパンチゲーム: tap the teasing blob to punch it. Hold, then let go, for a big punch.
   After the knockout, one sum with three answers; a wrong answer brings a new sum, so guessing does not get through. */
:root{
  --night:#1c1230; --star:#ffd23f; --pumpkin:#ff8a2a; --cream:#fff8ee; --mist:#d4c8f0;
  --f-pop:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--cream);font-family:var(--f-round);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:8px;padding:8px 12px;pointer-events:none;z-index:2}
.top>*{pointer-events:auto}
.icon-btn{display:grid;place-items:center;min-width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:var(--cream);font:400 20px var(--f-pop);text-decoration:none;cursor:pointer}
.icon-btn[aria-pressed="false"]{opacity:.5}
.lv{font:400 clamp(16px,4vw,22px) var(--f-pop);color:var(--star);text-shadow:0 3px 0 #6a2fb0}
.hp{flex:1;max-width:360px;margin-left:auto;height:22px;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);overflow:hidden;position:relative}
.hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff8a7a,#e8323a);border-radius:999px;transition:width .15s}
.tools{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;z-index:2;pointer-events:none}
.tool{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;padding:8px 0 6px;border-radius:20px;border:0;cursor:pointer;background:rgba(28,18,48,.85);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);color:var(--cream);font:400 14px var(--f-pop)}
.tool canvas{width:52px;height:52px}
.tool[aria-pressed="true"]{background:linear-gradient(#ffc070,var(--pumpkin));color:#3a1600;box-shadow:0 5px 0 #a8480b}
.tool:focus-visible,.btn:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none;z-index:3}
.overlay:empty{display:none}
.panel{pointer-events:auto;background:rgba(28,18,48,.94);border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,138,42,.35);padding:20px 22px 24px;width:min(480px,100%);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel h2{margin:0;font:400 clamp(28px,7vw,40px)/1.15 var(--f-pop);text-shadow:0 4px 0 #6a2fb0}
.panel h2 small{display:block;font-size:.45em;color:var(--pumpkin);text-shadow:none;margin-bottom:4px}
.panel p{margin:0;font-weight:800;line-height:1.6;color:var(--mist)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;text-decoration:none;font:400 24px var(--f-pop);letter-spacing:.06em;color:#3a1600;background:linear-gradient(#ffc070,var(--pumpkin));border:0;border-radius:999px;padding:13px 36px;box-shadow:0 6px 0 #a8480b,0 12px 24px rgba(0,0,0,.4);cursor:pointer}
.btn.sub{font-size:18px;padding:11px 22px;color:var(--cream);background:linear-gradient(#7a52d8,#4d2fa0);box-shadow:0 5px 0 #2a1866}
.btn:active{transform:translateY(4px)}
.sum{display:block;font-size:clamp(40px,11vw,64px);letter-spacing:.04em;white-space:nowrap}
.btn.num{font-size:clamp(32px,8vw,44px);min-width:92px;padding:12px 22px}
.btn.num:disabled{opacity:.35;box-shadow:none;transform:none}
.btn.num.right{opacity:1;background:linear-gradient(#b8f5a0,#3cbf5a)}
#sumMsg.no{color:#ff9a8a}
#sumMsg.yes{color:#b8f5a0}
.newtool{display:flex;align-items:center;gap:10px;font:400 22px var(--f-pop);color:var(--star)}
.newtool canvas{width:64px;height:64px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
<div id="stage">
  <canvas id="game" role="img" aria-label="ブヨンパンチゲーム。ブヨンさんを タッチすると パンチ。ながく おしてから はなすと ためパンチ。キーボードでは、ひだりと みぎの やじるしで よこから、うえの やじるしで うえから パンチ"></canvas>
  <div class="top">
    <a class="icon-btn" href="index.html" aria-label="ゲームを えらぶ">☰</a>
    <span class="lv" id="lv"></span>
    <button class="icon-btn" id="snd" aria-pressed="true" aria-label="おと">♪</button>
    <span class="hp" id="hp" role="img" hidden><i></i></span>
  </div>
  <div class="tools" id="tools" hidden></div>
  <div class="overlay" id="overlay" aria-live="polite"></div>
</div>

const $=id=>document.getElementById(id);
const cv=$('game'), cx=cv.getContext('2d'), overlay=$('overlay');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=k=>1-Math.pow(1-clamp(k,0,1),3);
const pick=a=>a[Math.random()*a.length|0];

// ---------- saved ----------
let best=1, soundOn=true;
try{ best=Math.max(1,+localStorage.getItem('byp-stage')||1); soundOn=localStorage.getItem('byp-sound')!=='0'; }catch(e){}
function save(){ try{ localStorage.setItem('byp-stage',best); localStorage.setItem('byp-sound',soundOn?'1':'0'); }catch(e){} }

// ---------- sound ----------
let ac=null; const vbuf={};
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state!=='running') ac.resume().catch(()=>{}); }
function tone(f,t,d,type,vol,f2){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02); }
function noise(t,d,vol,freq,type){ const n=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate), c=n.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=Math.random()*2-1; const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=n; f.type=type; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); }
const ok=()=>soundOn&&ac;
const sfx={
  whoosh(){ if(!ok()) return; const t=ac.currentTime; noise(t,.12,.08,1800,'bandpass'); },
  punch(p){ if(!ok()) return; const t=ac.currentTime; noise(t,.12,.35*p,700,'lowpass'); tone(160*(1+Math.random()*.3),t,.18,'sine',.3,60); tone(420,t+.03,.25,'sine',.08,220); if(p>1) tone(90,t,.45,'sawtooth',.12,40); },
  pico(){ if(!ok()) return; const t=ac.currentTime; tone(1800,t,.08,'square',.06,2400); tone(2400,t+.06,.1,'square',.05,1600); noise(t,.08,.15,1200,'lowpass'); },
  poof(){ if(!ok()) return; const t=ac.currentTime; noise(t,.3,.2,900,'lowpass'); },
  pop(){ if(!ok()) return; const t=ac.currentTime; tone(900,t,.06,'sine',.12,300); },
  ting(){ if(!ok()) return; const t=ac.currentTime; tone(2600,t,.15,'sine',.08,3400); },
  clang(){ if(!ok()) return; const t=ac.currentTime; [1900,2530,3170].forEach(f=>tone(f,t,.4,'triangle',.05)); noise(t,.06,.15,4000,'highpass'); },
  whiff(){ if(!ok()) return; const t=ac.currentTime; noise(t,.2,.1,3000,'bandpass'); },
  charge(){ if(!ok()) return; const t=ac.currentTime; tone(500,t,.15,'square',.03,900); },
  ko(){ if(!ok()) return; const t=ac.currentTime; tone(200,t,.8,'sawtooth',.1,1600); [784,988,1175,1568].forEach((f,i)=>tone(f,t+.5+i*.09,.25,'square',.05)); },
  clear(){ if(!ok()) return; const t=ac.currentTime; [523,659,784,1047,880,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.24,'square',.045)); },
  boo(){ if(!ok()) return; const t=ac.currentTime; tone(180,t,.5,'triangle',.14,110); },
  yes(){ if(!ok()) return; const t=ac.currentTime; tone(1047,t,.18,'sine',.12); tone(1568,t+.14,.4,'sine',.12); },
};
let vtok=0, vnode=null;
function vload(k){
  if(vbuf[k]) return vbuf[k];
  const data=VOICE[k]?Promise.resolve(Uint8Array.from(atob(VOICE[k]),c=>c.charCodeAt(0)).buffer):fetch(k).then(r=>r.ok?r.arrayBuffer():null).catch(()=>null);
  return vbuf[k]=data.then(b=>b?new Promise(res=>ac.decodeAudioData(b,res,()=>res(null))):null);
}
async function saySeq(keys){
  if(!soundOn) return; ensureAudio(); if(!ac) return;
  const tok=++vtok; if(vnode){ try{ vnode.stop(); }catch(e){} vnode=null; }
  for(const k of keys){
    const b=await vload(k); if(tok!==vtok) return; if(!b) continue;
    await new Promise(res=>{ const n=ac.createBufferSource(); n.buffer=b; n.connect(ac.destination); n.onended=res; vnode=n; n.start(); });
    if(tok!==vtok) return;
  }
}
const say=k=>saySeq([k]);

// ---------- tools ----------
// glove: from the side you touch. hammer (from stage 6): from above, gets past the lids. pillow (from stage 11): knocks lid and helmet away.
const TOOLS=[
  {id:'glove',name:'グローブ',from:1},
  {id:'hammer',name:'ハンマー',from:6},
  {id:'pillow',name:'まくら',from:11},
];
let tool='glove';

// ---------- the stages ----------
// guard: none | lid (one lid that changes sides) | lid2 (both sides) | helmet | mix | mix2 | all
const LAST=20;
function stageDef(n){
  const boss=n%5===0, endless=n>LAST;
  const d={n,boss,hp:Math.round((boss?26:9)+n*(boss?2.4:1.6)),move:0,guard:'none',color:n%7,acc:['none','ribbon','glasses','mustache','cap','bow','none'][n%7],hint:null};
  if(n===1) d.hint='tap';
  if(n===4) d.hint='charge';
  if(n>=3) d.move=Math.min(1,.25+(n-3)*.06);
  const G={6:'lid2',7:'lid',8:'lid',9:'helmet',10:'mix2',11:'all',12:'mix',13:'lid',14:'mix',15:'mix',16:'helmet',17:'mix',18:'all',19:'mix',20:'mix'};
  if(endless) d.guard=pick(['mix','mix','lid','helmet','all']); else if(G[n]) d.guard=G[n];
  if(boss) d.acc='crown';
  return d;
}

// ---------- state ----------
let W=800,H=600,DPR=1, R=150, HOME={x:400,y:330};
let state='title', level=1, def=null, t=0, slow=1, shake=0, gh=null, hits=[], fx=[], texts=[], holds={}, combo=0, lastHitT=-9, blockedRun=0, teaseT=0;
// ブヨンさん's skin: a little odd, still sweet
const COLORS=[['#ffd9c2','#e8946a'],['#d4f5c8','#7cc46a'],['#ffd0e6','#e787b4'],['#e2f0a0','#a8bf3a'],['#fff0a8','#e6b24a'],['#dcd2ff','#9b86e8'],['#c8eef5','#5cb4c8']];

function resize(){
  const r=$('stage').getBoundingClientRect(); DPR=Math.min(devicePixelRatio||1,2); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.min(W*.3,(H-220)*.3); HOME={x:W/2,y:64+(H-64-120)*.53};
}

function newBuyon(d){
  return {ox:0,oy:0,vx:0,vy:0,rot:0,vr:0,sq:0,vsq:0,hair:0,vhair:0,
    eyes:[{x:0,y:0,vx:0,vy:0},{x:0,y:0,vx:0,vy:0}], bulge:0,
    hp:d.hp,max:d.hp,face:'tease',faceT:0,blush:0,bumps:[],band:false,teeth:[1,1],snot:0,snotT:0,
    size:d.boss?1.18:1, col:d.boss?['#ffc8b0','#d8603a']:COLORS[d.color], acc:d.acc,
    lid:0, lidT:2, helmet:false, offT:0, guardMode:d.guard, mixT:0, cur:'none',
    flying:null, alive:true, wave:0};
}
function setGuard(g){
  const m=g.guardMode==='mix2'?pick(['lid','lid2','helmet']):g.guardMode==='mix'?pick(['lid','lid2','helmet','none']):g.guardMode;
  g.cur=m; g.helmet=m==='helmet'||m==='all'; g.lid=m==='lid2'||m==='all'?2:m==='lid'?(Math.random()<.5?-1:1):0;
}
function center(g=gh){
  const mv=def&&def.move?Math.sin(t*(.6+def.move*.9))*W*.16*def.move:0;
  return {x:HOME.x+mv+g.ox, y:HOME.y+g.oy+Math.sin(t*2.6)*R*.03};
}

function startLevel(n){
  level=n; def=stageDef(n); gh=newBuyon(def); setGuard(gh);
  hits=[]; texts=[]; fx=[]; holds={}; combo=0; blockedRun=0; teaseT=3; slow=1; state='fight'; overlay.innerHTML='';
  if(!TOOLS.find(x=>x.id===tool&&n>=x.from)) tool='glove';
  // a new tool comes with its first stage: pick it for the child
  const fresh=TOOLS.find(x=>x.from===n); if(fresh) tool=fresh.id;
  buildTools(); hud();
  if(def.boss){ texts.push({s:'でっかい ブヨンさん！',x:W/2,y:HOME.y-R*1.75,t:-.2,big:true}); say('boss'); }
  else if(n===1) say('start');
  else if(n===4) say('charge');
  else if({6:1,7:1,9:1,11:1}[n]) say({6:'lid2',7:'lid',9:'helmet',11:'mix'}[n]);
}
function hud(){
  $('lv').textContent=level>LAST?`むげん ${level-LAST}`:`ステージ ${level}`;
  const hp=$('hp'); hp.hidden=state!=='fight'&&state!=='ko'; if(gh){ hp.firstElementChild.style.width=(gh.hp/gh.max*100)+'%'; hp.setAttribute('aria-label',`ブヨンさんの げんき ${Math.ceil(gh.hp/gh.max*10)}／10`); }
}
function buildTools(){
  const box=$('tools'), list=TOOLS.filter(x=>level>=x.from);
  box.hidden=list.length<2||state!=='fight'; box.innerHTML='';
  list.forEach(x=>{ const b=document.createElement('button'); b.className='tool'; b.setAttribute('aria-pressed',x.id===tool); b.setAttribute('aria-label',x.name);
    const c=document.createElement('canvas'); c.width=c.height=104; c.setAttribute('aria-hidden','true'); toolIcon(c,x.id); b.appendChild(c); b.appendChild(document.createTextNode(x.name));
    b.onclick=()=>{ tool=x.id; box.querySelectorAll('.tool').forEach(o=>o.setAttribute('aria-pressed',o===b)); }; box.appendChild(b); });
}

// ---------- punching ----------
// is the touch on the body? (a pear: about 1 wide, from 1.0 above the middle to 1.15 below, hair and feet a little more)
function onBody(x,y){ const c=center(), s=R*gh.size, dx=(x-c.x)/s, dy=(y-c.y)/s; return dx*dx/1.1+(dy<0?dy*dy/1.25:dy*dy/1.3)<1; }
function fire(px,py,power){
  if(state!=='fight'||!gh.alive) return;
  const c=center(), hit=onBody(px,py), side=px<c.x?-1:1;
  const T=tool==='hammer'?{dur:.36,reach:.12}:tool==='pillow'?{dur:.42,reach:.14}:{dur:.3,reach:.085};
  hits.push({tool,side,rel:{x:px-c.x,y:py-c.y},power,t:0,dur:T.dur,reach:T.reach,done:false,miss:!hit});
  sfx.whoosh();
}
function land(h){
  const g=gh, c=center(), p={x:c.x+h.rel.x,y:c.y+h.rel.y}, s=R*g.size;
  if(h.miss){ sfx.whiff(); texts.push({s:'スカッ',x:p.x,y:p.y,t:0}); g.face='tease'; g.faceT=.8; return; }
  // the guard: lids stop side hits on their side (both lids: all side hits); the helmet stops the hammer
  const sideHit=h.tool!=='hammer';
  const blocked=h.tool!=='pillow'&&((sideHit&&(g.lid===2||g.lid===h.side))||(!sideHit&&g.helmet));
  if(blocked){
    sfx.clang(); h.bounce=true; blockedRun++; g.face='tease'; g.faceT=1.2; g.vr+=sideHit?h.side*.5:0;
    for(let i=0;i<12;i++) spark(p.x,p.y,'#fff4b0');
    texts.push({s:'カキーン！',x:p.x,y:p.y-R*.2,t:0});
    if(blockedRun>=2) hintNow(); return;
  }
  blockedRun=0;
  if(h.tool==='pillow'){
    if(g.lid||g.helmet){ drop(g); g.offT=4; texts.push({s:'とれた！',x:c.x,y:c.y-R*1.4,t:0,big:true}); }
    for(let i=0;i<18;i++) fx.push({x:p.x,y:p.y,vx:rand(-260,260),vy:rand(-300,60),life:rand(1.2,2),max:2,col:'#ffffff',s:rand(8,14),feather:true,rot:rand(0,6)});
    sfx.poof();
  }
  const pw=h.power, dmg=(h.tool==='hammer'?2:1)*(pw>1?3:1);
  const before=g.hp; g.hp=Math.max(0,g.hp-dmg);
  combo=t-lastHitT<.7?combo+1:1; lastHitT=t;
  // the body: pushed away from the hit, turned by where it was hit, squashed; eyes and hair wobble behind
  const k=(pw>1?2.4:1)/g.size, dirx=sideHit?-h.side:0, diry=sideHit?-.15:1;
  g.vx+=dirx*R*7*k; g.vy+=diry*R*4.5*k;
  g.vr+=(sideHit?dirx*(.8+(h.rel.y<0?.8:-.3)):(h.rel.x/R)*-2.5)*k*2.2;
  g.vsq+=(sideHit?-5:6)*k; g.vhair+=(sideHit?-dirx:rand(-1,1))*14*k;
  g.eyes.forEach(e=>{ e.vx+=-dirx*R*9*k*rand(.6,1.3)+rand(-1,1)*R*3; e.vy+=-diry*R*7*k*rand(.6,1.3)+rand(-1,1)*R*3; });
  g.bulge=Math.min(1,g.bulge+.6*k); g.blush=Math.min(1,g.blush+.25); g.face=pw>1?'dizzy':'ouch'; g.faceT=pw>1?1.4:.55;
  // the snot bubble pops
  if(g.snot>.25){ sfx.pop(); const nx=c.x+s*.12, ny=c.y-s*.05; for(let i=0;i<8;i++) fx.push({x:nx,y:ny,vx:rand(-180,180),vy:rand(-200,50),life:.6,max:.6,col:'#bfe8ff',s:rand(5,9),drop:true}); texts.push({s:'パチン',x:nx+s*.3,y:ny,t:0}); }
  g.snot=0; g.snotT=1.5;
  // teeth fly out: one at a big punch or past half way, the other near the end
  const knock=i=>{ if(!g.teeth[i]) return; g.teeth[i]=0; sfx.ting(); fx.push({x:c.x+(i?1:-1)*s*.07,y:c.y+s*.2,vx:(dirx||(i?1:-1))*rand(220,380),vy:-rand(380,520),life:1.6,max:1.6,tooth:true,rot:0,vr:rand(-14,14)}); texts.push({s:'はが ぬけた！',x:c.x,y:c.y+s*1.35,t:0,big:true,col:'#fff8ee'}); if(Math.random()<.5) say('tooth'); };
  if((pw>1||before>g.max*.55&&g.hp<=g.max*.55)) knock(g.teeth[0]?0:1);
  if(before>g.max*.2&&g.hp<=g.max*.2) knock(g.teeth[1]?1:0);
  if(h.tool==='hammer'&&g.bumps.length<4&&Math.random()<.6) g.bumps.push({a:clamp(Math.atan2(h.rel.y,h.rel.x),-2.6,-.5),s:0});
  if(g.hp<g.max*.5) g.band=true;
  shake=Math.max(shake,pw>1?14:4);
  if(h.tool==='hammer') sfx.pico(); else sfx.punch(pw);
  for(let i=0;i<(pw>1?16:8);i++){ const a=rand(0,Math.PI*2), v=rand(120,380)*(pw>1?1.6:1); fx.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.8),max:.8,col:pick(['#ffd23f','#ffffff','#ff8a2a']),s:rand(8,16)*(pw>1?1.4:1),star:true,rot:rand(0,6)}); }
  for(let i=0;i<3;i++) fx.push({x:c.x+rand(-.5,.5)*R,y:c.y-R*.8,vx:rand(-120,120),vy:rand(-260,-120),life:.9,max:.9,col:'#7ad3ff',s:rand(9,13),drop:true});
  texts.push({s:pw>1?pick(['ドカーン！','バキーン！']):h.tool==='hammer'?pick(['ピコッ！','ポカッ！']):h.tool==='pillow'?'ボフッ！':pick(['ボヨン！','ブニッ！','ポコッ！','バシッ！']),x:p.x,y:p.y-R*.15,t:0,big:pw>1});
  if(combo>=3) texts.push({s:combo+'れんぱつ！',x:c.x,y:c.y-R*1.55,t:0,big:true,col:'#ff8a2a'});
  hud();
  if(g.hp<=0) knockout(dirx||(Math.random()<.5?-1:1));
}
function drop(g){
  const c=center();
  if(g.lid===2||g.lid===-1) fx.push({x:c.x-R*1.05,y:c.y+R*.2,vx:-rand(200,320),vy:-rand(250,400),life:1.6,max:1.6,lid:true,rot:0,vr:-8});
  if(g.lid===2||g.lid===1) fx.push({x:c.x+R*1.05,y:c.y+R*.2,vx:rand(200,320),vy:-rand(250,400),life:1.6,max:1.6,lid:true,rot:0,vr:8});
  if(g.helmet) fx.push({x:c.x,y:c.y-R*1.0,vx:rand(-160,160),vy:-rand(380,520),life:1.6,max:1.6,helm:true,rot:0,vr:rand(-9,9)});
  g.lid=0; g.helmet=false;
}
function spark(x,y,col){ const a=rand(0,Math.PI*2), v=rand(150,420); fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35,max:.35,col,s:rand(3,6)}); }
function hintNow(){
  const g=gh, have=TOOLS.filter(x=>level>=x.from).map(x=>x.id);
  let s;
  if(g.lid&&g.lid!==2&&tool!=='hammer') s='ふたの ない ほうを パンチ！';
  else if(g.lid===2&&!g.helmet&&have.includes('hammer')) s='ハンマーで うえから！';
  else if(g.helmet&&!g.lid) s='グローブで よこから！';
  else if(have.includes('pillow')) s='まくらで ふっとばせ！';
  if(s) texts.push({s,x:W/2,y:HOME.y+R*1.55,t:-.1,big:true,col:'#ffd23f',long:true});
}
function knockout(dir){
  const g=gh; g.alive=false; state='ko'; slow=.25; g.face='ko'; shake=20; sfx.ko(); say('ko');
  g.flying={vx:dir*W*1.3,vy:-H*1.5,vr:dir*14,s:1};
  setTimeout(()=>{ slow=1; },380);
  setTimeout(()=>{ texts.push({s:'キラーン☆',x:W*(dir>0?.82:.18),y:H*.14,t:0,big:true,col:'#ffd23f'}); },1300);
  setTimeout(()=>{ if(state==='ko') askSum(); },2300);
  hud(); buildTools();
}

// input: a short touch punches when you let go; a touch held 0.45s charges a big punch
const CHARGE=.45;
cv.addEventListener('pointerdown',e=>{
  if(state!=='fight') return; ensureAudio(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const r=cv.getBoundingClientRect(); holds[e.pointerId]={x:e.clientX-r.left,y:e.clientY-r.top,t:0,beeped:0};
});
cv.addEventListener('pointermove',e=>{ const h=holds[e.pointerId]; if(!h) return; const r=cv.getBoundingClientRect(); h.x=e.clientX-r.left; h.y=e.clientY-r.top; });
cv.addEventListener('pointerup',e=>{ const h=holds[e.pointerId]; delete holds[e.pointerId]; if(!h||state!=='fight') return; fire(h.x,h.y,h.t>=CHARGE?3:1); });
cv.addEventListener('pointercancel',e=>{ delete holds[e.pointerId]; });
addEventListener('keydown',e=>{
  if(state!=='fight'||overlay.innerHTML) return;
  const c=center(), s=R*gh.size;
  if(e.key==='ArrowLeft'){ fire(c.x-s*.5,c.y,1); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ fire(c.x+s*.5,c.y,1); e.preventDefault(); }
  else if(e.key==='ArrowUp'||e.key===' '){ fire(c.x,c.y-s*.6,1); e.preventDefault(); }
  else if(/^[1-3]$/.test(e.key)){ const x=TOOLS[+e.key-1]; if(x&&level>=x.from){ tool=x.id; buildTools(); } }
});

// ---------- the sum: a wrong answer brings a new sum ----------
let lastSum='';
function askSum(){
  state='sum'; hud(); buildTools();
  let a,b; do{ a=1+(Math.random()*9|0); b=1+(Math.random()*9|0); }while(a+'+'+b===lastSum); lastSum=a+'+'+b;
  const ans=a+b, wrong=[ans-1,ans+1,ans-2,ans+2].filter(n=>n>=2&&n<=18).sort(()=>Math.random()-.5).slice(0,2), ch=[ans,...wrong].sort(()=>Math.random()-.5);
  panel(`<h2><small>さいごに たしざん！</small><span class="sum" aria-label="${a} たす ${b} は？">${a} ＋ ${b} ＝ ？</span></h2><p id="sumMsg">こたえは どれかな？</p>
    <div class="btns">${ch.map(n=>`<button class="btn num" data-n="${n}">${n}</button>`).join('')}</div>`);
  saySeq(['sum',`a/shuri/v/q_${a}_${b}.m4a`]);
  const btns=[...overlay.querySelectorAll('.num')];
  btns.forEach(bt=>bt.onclick=()=>{
    if(state!=='sum') return;
    const msg=$('sumMsg'), right=btns.find(x=>+x.dataset.n===ans);
    btns.forEach(x=>x.disabled=true); right.disabled=false; right.classList.add('right');
    overlay.querySelector('.sum').textContent=`${a} ＋ ${b} ＝ ${ans}`;
    if(bt===right){
      state='summed'; msg.textContent='せいかい！'; msg.className='yes';
      sfx.yes(); saySeq([`a/shuri/v/a_${a}_${b}.m4a`]); setTimeout(clearStage,1900);
    }else{
      // show the right answer, then a different sum: pressing all three does not get through
      state='wrong'; sfx.boo(); msg.textContent='ざんねん！ あたらしい もんだいだよ'; msg.className='no';
      saySeq([`a/shuri/v/a_${a}_${b}.m4a`,'wrong']);
      setTimeout(()=>{ if(state==='wrong') askSum(); },3200);
    }
  });
}

// ---------- clear ----------

  for(let i=0;i<120;i++) fx.push({x:rand(0,W),y:rand(-H*.3,0),vx:rand(-40,40),vy:rand(60,260),life:rand(1.8,3),max:3,col:pick(['#ff8a2a','#ffd23f','#b36bff','#58e8ff','#ff7fc8','#ffffff']),s:rand(6,11),conf:true});

    <div class="btns"><button class="btn" id="go">${best>1?(best>LAST?'むげん '+(best-LAST):'ステージ '+best)+' から':'はじめる'}</button>${best>1?'<button class="btn sub" id="first">さいしょから</button>':''}</div>`);

// ---------- the loop ----------
function spring(o,v,k,c,dt){ return v+(-k*o-c*v)*dt; }
function update(rdt){
  const dt=rdt*slow; t+=dt;
  if(shake>0) shake=Math.max(0,shake-rdt*40);
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.feather){ p.vx*=.96; p.vy=Math.min(p.vy+200*dt,70); p.x+=Math.sin(t*5+p.rot)*30*dt; p.rot+=dt*2; }
    else if(p.lid||p.helm||p.tooth){ p.vy+=1400*dt; p.rot+=p.vr*dt; }
    else if(!p.conf) p.vy+=(p.drop?900:300)*dt;
    if(p.star) p.rot+=dt*6; p.life-=dt; if(p.life<=0) fx.splice(i,1); }
  for(let i=texts.length-1;i>=0;i--){ texts[i].t+=dt; if(texts[i].t>(texts[i].long?2.4:1.3)) texts.splice(i,1); }
  for(const id in holds){ const h=holds[id]; h.t+=rdt; if(h.t>=CHARGE&&!h.beeped){ h.beeped=1; sfx.charge(); } }
